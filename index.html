<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE Matrix ECE - AI Chatbot Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
        .welcome-box {
            text-align: center;
            max-width: 600px;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.6; }

        /* CHATBOT STYLES */
        #ece-chatbot-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9999;
        }
        #chatbot-toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            font-size: 28px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s;
        }
        #chatbot-toggle-btn:hover { transform: scale(1.1); }
        
        #chatbot-window {
            width: 380px;
            height: 520px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: absolute;
            bottom: 80px;
            right: 0;
        }
        .hidden { display: none !important; }
        
        #chatbot-header {
            background-color: #0f172a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        #chatbot-header h4 { margin: 0; font-size: 16px; color: #38bdf8; }
        #chatbot-header button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; }
        #chatbot-header button:hover { color: white; }
        
        #chatbot-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #0f172a;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .bot-msg { background-color: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .user-msg { background-color: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        #chatbot-quick-prompts {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background: #0f172a;
        }
        #chatbot-quick-prompts button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #chatbot-quick-prompts button:hover { background: #334155; color: white; }
        
        #chatbot-input-area {
            display: flex;
            padding: 15px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }
        #user-chat-input {
            flex: 1;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            outline: none;
        }
        #user-chat-input::placeholder { color: #64748b; }
        #send-chat-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 18px;
            margin-left: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        #send-chat-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>GATE Matrix ECE Portal</h1>
        <p>Your workspace is running! Click the chat icon in the bottom right corner to speak with your AI assistant.</p>
    </div>

    <!-- AI Chatbot Widget -->
    <div id="ece-chatbot-container">
        <button id="chatbot-toggle-btn" onclick="toggleChatbot()">💬</button>

        <div id="chatbot-window" class="hidden">
            <div id="chatbot-header">
                <h4>⚡ Silicon Assistant (ECE)</h4>
                <button onclick="toggleChatbot()">✖</button>
            </div>
            <div id="chatbot-messages">
                <div class="message bot-msg">
                    Hello! I am your specialized ECE companion. Ask me any GATE exam doubts, syllabus timelines, or core engineering numerical questions!
                </div>
            </div>
            <div id="chatbot-quick-prompts">
                <button onclick="sendQuickPrompt('What subjects are in GATE ECE?')">Syllabus</button>
                <button onclick="sendQuickPrompt('Explain standard negative feedback in amplifiers')">Analog Doubt</button>
            </div>
            <div id="chatbot-input-area">
                <input type="text" id="user-chat-input" placeholder="Type an ECE or GATE query..." onkeypress="handleKeyPress(event)">
                <button id="send-chat-btn" onclick="submitUserMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Your real Google Gemini API Key injected here
        const GEMINI_API_KEY = "AIzaSyAQ.Ab8RN6K6vAf99BrFp58X40xkrrZeUCCzSLIXjv6MVgF5JMcjdQ";

        function toggleChatbot() {
            const win = document.getElementById('chatbot-window');
            win.classList.toggle('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') submitUserMessage();
        }

        function sendQuickPrompt(text) {
            document.getElementById('user-chat-input').value = text;
            submitUserMessage();
        }

        async function submitUserMessage() {
            const inputEl = document.getElementById('user-chat-input');
            const msgText = inputEl.value.trim();
            if (!msgText) return;

            appendMessage(msgText, 'user-msg');
            inputEl.value = '';

            const loadingDiv = appendMessage('Thinking...', 'bot-msg');

            try {
                // Directly calling Google Gemini 1.5 Flash model
                const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: msgText }] }],
                        systemInstruction: {
                            parts: [{ text: "You are the specialist GATE Matrix ECE AI Assistant. Expertly resolve Electronics & Communication Engineering problems (Signals, Networks, EDC, Analog, Digital, Communications, Electromagnetics). Answer syllabus questions, layout structures, and provide clear rules/strategies for the GATE Examination." }]
                        }
                    })
                });

                const data = await response.json();
                loadingDiv.remove();

                // Extract reply text from Gemini structure safely
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    appendMessage(botReply, 'bot-msg');
                } else {
                    appendMessage("Sorry, I encountered an issue interpreting the response format.", 'bot-msg');
                }
            } catch (error) {
                loadingDiv.textContent = "Error connecting to Gemini. Check your network or API Key.";
                console.error(error);
            }
        }

        function appendMessage(text, className) {
            const msgBox = document.getElementById('chatbot-messages');
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            msgBox.appendChild(div);
            msgBox.scrollTop = msgBox.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
